[package]
name = "studio-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.28", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "8"
bcrypt = "0.13"
config = "0.13"
env_logger = "0.9"
nanoid = "0.4"
# Para Excel, podríamos usar rust_xlsxwriter o similar
rust_xlsxwriter = "0.36"